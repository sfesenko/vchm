name: build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      render_test:
        description: Build and run the Xvfb render smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: meson build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # master pushes run the full suite (incl. the Xvfb view-layer smoke);
      # manual UI runs opt in via the checkbox.
      ENABLE_RENDER_TEST: ${{ github.event_name == 'push' && 'true' || inputs.render_test || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Runner-owned .deb store; apt skips downloading seeded archives.
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-24.04-${{ hashFiles('.github/apt-packages.txt') }}

      - name: Install dependencies
        run: |
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/ci-speedup
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt)
          sudo cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER":"$(id -gn)" ~/apt-debs

      - name: Toolchain versions
        run: |
          meson --version
          valac --version
          pkg-config --modversion gtk4 webkitgtk-6.0 gee-0.8

      # meson wraps the compiler with ccache automatically when it is in PATH.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: meson setup builddir -Denable_render_test=$ENABLE_RENDER_TEST

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-testlog
          path: builddir/meson-logs/testlog.txt
          if-no-files-found: ignore
